[package]
name = "lace"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lace"
path = "src/main.rs"
test = false
bench = false

[dependencies]
arm-pl011-uart = { version = "0.4.0", default-features = false }
elf = { version = "0.8.0", default-features = false, features = ["alloc"] }
tock-registers = { path = "../tockreg" }

[build-dependencies]
cc = "1.2.53"
